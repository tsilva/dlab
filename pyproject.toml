[project]
name = "dlab"
version = "0.1.0"
description = "Fast, reproducible deep learning experiments from local runs to cloud sweeps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34,<2",
    "einops>=0.8.0",
    "hydra-core>=1.3.2",
    "jupyterlab>=4.6.3,<5",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "medmnist>=3.0.2,<4",
    "modal>=1.4.2",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "onnx>=1.22.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pytorch-lightning>=2.6.5",
    "runpod-flash>=1.19.0",
    "scikit-learn>=1.9.0",
    "timm>=1.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=4.44.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
