[project]
name = "dlab"
version = "0.1.0"
description = "Fast, reproducible deep learning experiments from local runs to cloud sweeps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.118,<2",
    "einops>=0.8.2",
    "hydra-core>=1.3.7",
    "jupyterlab>=4.6.4,<5",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "medmnist>=3.0.2,<4",
    "modal>=1.6.2",
    "numpy>=2.5.4",
    "omegaconf>=2.4.0",
    "onnx>=1.23.2",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pytorch-lightning>=2.6.6",
    "runpod-flash>=1.21.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "wandb>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
