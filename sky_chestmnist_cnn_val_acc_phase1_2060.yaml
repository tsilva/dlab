name: dlab-chestmnist-cnn-val-acc-phase1-2060

workdir: .

resources:
  accelerators: {RTX2060: 1}

setup: |
  set -euo pipefail
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  export UV_CACHE_DIR="$HOME/.cache/uv-dlab"
  export MPLCONFIGDIR="$HOME/.cache/matplotlib-dlab"
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  mkdir -p "$MPLCONFIGDIR" datasets
  uv sync --python 3.12 --frozen --no-dev

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export UV_CACHE_DIR="$HOME/.cache/uv-dlab"
  export MPLCONFIGDIR="$HOME/.cache/matplotlib-dlab"
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  mkdir -p "$MPLCONFIGDIR" datasets
  : "${WANDB_API_KEY:?WANDB_API_KEY is required}"
  : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
  : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
  : "${AWS_S3_ENDPOINT_URL:?AWS_S3_ENDPOINT_URL is required}"
  : "${AWS_REGION:?AWS_REGION is required}"
  : "${CHECKPOINT_BUCKET_URI:?CHECKPOINT_BUCKET_URI is required}"

  echo "provider_compute_cost=0_usd_local_rtx2060"
  echo "electricity_cost=not_metered"
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true

  .venv/bin/python sweep.py \
    sweep=chestmnist_cnn_val_acc_phase1 \
    backend=wandb \
    wandb.entity=tsilva \
    wandb.project=dlab \
    wandb_sweep.start_agent=true \
    wandb_sweep.agents=2

  .venv/bin/python sweep.py \
    sweep=chestmnist_resnet18_val_acc_phase1 \
    backend=wandb \
    wandb.entity=tsilva \
    wandb.project=dlab \
    wandb_sweep.start_agent=true \
    wandb_sweep.agents=2
