id: 002_pixel_rnn_failure_probe
project: sequence_modeling_basics
status: completed

run:
  project: sequence_modeling_basics
  stage: 04_sequence_modeling
  study: 002_pixel_rnn_failure_probe

question: >
  Does a vanilla RNN fail or degrade when MNIST is treated as a 784-step pixel sequence instead of 28 row steps?

hypothesis: >
  A vanilla RNN should struggle more on 784-step pixel sequences because long-range credit assignment and vanishing gradients make optimization harder than row-wise sequential MNIST.

selection:
  metric: val/acc
  mode: max
  test_used_for_selection: false

controlled_variables:
  - dataset
  - optimizer
  - learning_rate
  - batch_size
  - epoch_budget
  - recurrent_hidden_dim
changed_variables:
  - model.params.sequence_axis
  - model.params.input_size

config: configs/experiment/mnist_rnn_pixel_failure.yaml

failure_criteria:
  baseline: 001_rnn_baseline
  symptoms:
    - materially lower validation accuracy than the 28-step row RNN after the same epoch budget
    - slow validation accuracy improvement after the first epoch
    - high or unstable validation loss relative to the row RNN
    - gradient clipping pressure or weak recurrent gradient-flow diagnostics

artifact_key:
  naming_source: dlab_generated_run_name
  wandb_artifact_suffix: -run

