# @package _global_
name: mnist_rnn_val_acc_confirm_sweep
experiment: mnist_rnn_val_acc_search
train_script: train.py
backend: local
stop_on_failure: true
run:
  project: mnist_rnn_val_acc
  stage: 04_sequence_modeling
  study: 001_rnn_architecture_search
  question: Do the best phase-1 RNN configurations stay best on additional validation splits/seeds?
  hypothesis: The best phase-1 GRU/LSTM row or column configuration should remain the top selected-validation-accuracy candidate across confirmation seeds.
  goal: Confirm top phase-1 candidates before selecting the current best config.
  expected_pattern: The winner should keep the best mean selected validation accuracy, not merely one lucky seed.
  controlled_variables: [dataset, validation_split_policy, checkpoint_selection, test_policy, hardware_target]
  changed_variables: [seed, top_phase1_config]
  tags: [mnist, sequence-modeling, rnn, confirmation, validation-search, rtx2060]
parameters:
  seed: [2024, 9001]
